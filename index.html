<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Life Manager</title>
    <style>
      :root {
        --bg: #0f1419;
        --surface: #1a2332;
        --surface2: #243044;
        --border: #2d3a4f;
        --text: #e8edf4;
        --muted: #8b9cb3;
        --accent: #5ce1e6;
        --accent2: #a78bfa;
        --player: #34d399;
        --dev: #fbbf24;
        --danger: #f87171;
        --radius: 10px;
        --font: 'Segoe UI', system-ui, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.5;
      }
      .app { max-width: 960px; margin: 0 auto; padding: 1rem 1.25rem 2rem; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border);
      }
      header h1 { font-size: 1.35rem; font-weight: 700; }
      header h1 span { color: var(--accent); }
      nav {
        display: flex;
        gap: 0.35rem;
        background: var(--surface);
        padding: 0.35rem;
        border-radius: var(--radius);
        border: 1px solid var(--border);
      }
      nav button {
        border: none;
        background: transparent;
        color: var(--muted);
        padding: 0.5rem 1rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        transition: 0.15s;
      }
      nav button.active {
        background: var(--surface2);
        color: var(--text);
      }
      nav button[data-view='player'].active { color: var(--player); }
      nav button[data-view='developer'].active { color: var(--dev); }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1rem 1.1rem;
        margin-bottom: 0.85rem;
      }
      .card h2, .card h3 {
        font-size: 0.95rem;
        margin-bottom: 0.65rem;
        color: var(--accent);
      }
      .card h3 { font-size: 0.88rem; color: var(--muted); }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; }
      @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
      .muted { color: var(--muted); font-size: 0.85rem; }
      .empty { color: var(--muted); font-size: 0.88rem; padding: 0.5rem 0; }
      input, textarea, select {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.5rem 0.65rem;
        border-radius: 8px;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
      }
      textarea { min-height: 72px; resize: vertical; }
      .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.5rem; }
      .row input, .row select { flex: 1; min-width: 120px; margin-bottom: 0; }
      button.btn {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.45rem 0.85rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 600;
      }
      button.btn:hover { border-color: var(--accent); }
      button.btn-primary { background: #1e3a5f; border-color: var(--accent); color: var(--accent); }
      button.btn-player { border-color: var(--player); color: var(--player); }
      button.btn-dev { border-color: var(--dev); color: var(--dev); }
      button.btn-danger { border-color: var(--danger); color: var(--danger); }
      button.btn-sm { padding: 0.3rem 0.55rem; font-size: 0.78rem; }
      ul.list { list-style: none; }
      ul.list li {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        padding: 0.45rem 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.88rem;
      }
      ul.list li:last-child { border-bottom: none; }
      .game-item, .project-item {
        cursor: pointer;
        padding: 0.55rem 0.65rem;
        border-radius: 8px;
        margin-bottom: 0.35rem;
        border: 1px solid transparent;
      }
      .game-item:hover, .project-item:hover { background: var(--surface2); }
      .game-item.selected, .project-item.selected {
        border-color: var(--accent);
        background: var(--surface2);
      }
      .badge {
        display: inline-block;
        font-size: 0.72rem;
        padding: 0.15rem 0.45rem;
        border-radius: 6px;
        background: var(--surface2);
        color: var(--muted);
      }
      .badge-planned { color: #93c5fd; }
      .badge-in_progress { color: var(--dev); }
      .badge-completed { color: var(--player); }
      .xp-bar-wrap { margin-top: 0.5rem; }
      .xp-bar-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.82rem;
        margin-bottom: 0.35rem;
      }
      .xp-bar {
        height: 12px;
        background: var(--bg);
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .xp-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--dev), var(--accent2));
        border-radius: 6px;
        transition: width 0.3s;
      }
      .toast {
        position: fixed;
        bottom: 1.25rem;
        right: 1.25rem;
        background: var(--surface2);
        border: 1px solid var(--accent);
        color: var(--accent);
        padding: 0.65rem 1rem;
        border-radius: var(--radius);
        font-size: 0.88rem;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
        z-index: 100;
      }
      .toast.show { opacity: 1; }
      label.chk { display: flex; align-items: center; gap: 0.45rem; cursor: pointer; flex: 1; }
      label.chk input { width: auto; margin: 0; }
      .done-text { text-decoration: line-through; color: var(--muted); }
      .split { display: grid; grid-template-columns: 220px 1fr; gap: 1rem; }
      @media (max-width: 720px) { .split { grid-template-columns: 1fr; } }
      .section-title {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 0.85rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .badge-scheduled { color: #93c5fd; }
      .badge-planning { color: #c4b5fd; }
      .badge-development { color: var(--dev); }
      .badge-testing { color: #fb923c; }
      .badge-closing { color: #f472b6; }
      .badge-completed { color: var(--player); }
      .badge-stopped { color: var(--muted); }
      .progress-block { margin: 0.5rem 0 0.75rem; }
      .progress-block input[type='range'] { width: 100%; margin: 0.35rem 0; }
      .progress-block .progress-val { font-size: 0.85rem; color: var(--dev); font-weight: 600; }
      .task-row { flex-wrap: wrap; align-items: center !important; }
      .task-row input.task-title-input { flex: 1; min-width: 140px; margin-bottom: 0; }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      .stat-box {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.55rem 0.65rem;
        text-align: center;
      }
      .stat-box .num { font-size: 1.25rem; font-weight: 700; color: var(--player); }
      .stat-box .lbl { font-size: 0.72rem; color: var(--muted); }
      .chart-wrap {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.65rem;
        margin-top: 0.5rem;
      }
      .chart-wrap canvas { width: 100%; height: auto; display: block; }
      .chart-legend { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; font-size: 0.78rem; margin-top: 0.5rem; }
      .chart-legend span::before {
        content: '';
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 0.35rem;
        vertical-align: middle;
      }
      .compare-table { width: 100%; font-size: 0.82rem; border-collapse: collapse; }
      .compare-table th, .compare-table td {
        padding: 0.4rem 0.5rem;
        border-bottom: 1px solid var(--border);
        text-align: left;
      }
      .compare-table th { color: var(--muted); font-weight: 600; }
      .event-item { font-size: 0.88rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
      .tabs-inline { display: flex; gap: 0.35rem; margin-bottom: 0.65rem; flex-wrap: wrap; }
      .tabs-inline button.active { border-color: var(--player); color: var(--player); }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>🎮 <span>Game Life</span> Manager</h1>
        <nav id="nav"></nav>
      </header>
      <main id="main"></main>
    </div>
    <div id="toast" class="toast"></div>

    <script>
      /* ═══════════════════════════════════════════════════════════════
         데이터 구조 (src/types/index.ts)
      ═══════════════════════════════════════════════════════════════ */
      const STORAGE_KEY = 'game-life-manager:v1';

      const PROJECT_STATUSES = [
        { id: 'scheduled', label: '예정', hasPercent: false },
        { id: 'planning', label: '기획', hasPercent: true },
        { id: 'development', label: '개발', hasPercent: true },
        { id: 'testing', label: '테스트', hasPercent: true },
        { id: 'closing', label: '마감', hasPercent: true },
        { id: 'completed', label: '완료', hasPercent: false },
        { id: 'stopped', label: '중지', hasPercent: false },
      ];

      function createInitialAppData() {
        return {
          version: 2,
          games: [],
          devProjects: [],
          developerStats: { totalXp: 0, level: 1, recentXpEvents: [] },
        };
      }

      function migrateAppData(parsed) {
        if (!parsed || typeof parsed !== 'object') return createInitialAppData();

        parsed.games = (parsed.games || []).map((g) => {
          const copy = { ...g };
          delete copy.weeklyGoal;
          return {
            ...copy,
            events: copy.events || [],
            accessLogs: (copy.accessLogs || []).map((log) => {
              const playedDate =
                log.playedDate ||
                (log.playedAt && log.playedAt.slice(0, 10)) ||
                todayStr();
              return {
                id: log.id || uid(),
                playedDate,
                memo: log.memo,
              };
            }),
            checklist: copy.checklist || [],
            memo: copy.memo || '',
          };
        });

        const statusMap = {
          planned: 'scheduled',
          backlog: 'scheduled',
          scheduled: 'scheduled',
          design: 'planning',
          planning: 'planning',
          dev: 'development',
          development: 'development',
          in_progress: 'development',
          test: 'testing',
          testing: 'testing',
          polish: 'closing',
          closing: 'closing',
          released: 'completed',
          completed: 'completed',
          hold: 'stopped',
          stopped: 'stopped',
        };

        parsed.devProjects = (parsed.devProjects || []).map((p) => {
          const st = statusMap[p.status] || p.status || 'scheduled';
          const def = PROJECT_STATUSES.find((s) => s.id === st) || PROJECT_STATUSES[0];
          const ideas = (p.ideas || []).map((idea) => ({
            id: idea.id || uid(),
            body: idea.body || idea.title || '',
            memoDate:
              idea.memoDate ||
              (idea.createdAt && idea.createdAt.slice(0, 10)) ||
              todayStr(),
            pinned: !!idea.pinned,
            createdAt: idea.createdAt || nowIso(),
            updatedAt: idea.updatedAt || nowIso(),
          }));
          return {
            ...p,
            status: st,
            progressPercent: def.hasPercent
              ? Math.min(100, Math.max(0, p.progressPercent ?? 0))
              : undefined,
            ideas,
            tasks: p.tasks || [],
          };
        });

        if (parsed.ideaMemos && parsed.ideaMemos.length) {
          parsed.ideaMemos.forEach((m) => {
            const pid = m.projectId;
            const proj = pid && parsed.devProjects.find((x) => x.id === pid);
            const idea = {
              id: m.id || uid(),
              body: m.body || m.title || '',
              memoDate:
                m.memoDate ||
                (m.createdAt && m.createdAt.slice(0, 10)) ||
                todayStr(),
              pinned: !!m.pinned,
              createdAt: m.createdAt || nowIso(),
              updatedAt: m.updatedAt || nowIso(),
            };
            if (proj) proj.ideas.push(idea);
            else if (parsed.devProjects[0]) parsed.devProjects[0].ideas.push(idea);
          });
        }

        delete parsed.devJournals;
        delete parsed.ideaMemos;
        parsed.version = 2;
        parsed.developerStats = parsed.developerStats || {
          totalXp: 0,
          level: 1,
          recentXpEvents: [],
        };
        return parsed;
      }

      /* ═══════════════════════════════════════════════════════════════
         RPG (src/types/rpg.ts)
      ═══════════════════════════════════════════════════════════════ */
      const XP_REWARDS = { task_complete: 5 };
      let chartWeeks = 8;
      const LEVEL_THRESHOLDS = [0, 100, 250, 450, 700, 1000, 1350, 1750, 2200, 2700];

      function thresholdForLevel(level) {
        if (level <= 1) return 0;
        if (level - 1 < LEVEL_THRESHOLDS.length) return LEVEL_THRESHOLDS[level - 1];
        const lastDefined = LEVEL_THRESHOLDS.length;
        let lastXp = LEVEL_THRESHOLDS[lastDefined - 1];
        let prevXp = LEVEL_THRESHOLDS[lastDefined - 2];
        let gap = lastXp - prevXp;
        let xp = lastXp;
        for (let lv = lastDefined + 1; lv <= level; lv++) {
          gap += 50;
          xp += gap;
        }
        return xp;
      }

      function levelFromTotalXp(totalXp) {
        let level = 1;
        while (thresholdForLevel(level + 1) <= totalXp) level++;
        return level;
      }

      function xpProgressInLevel(totalXp) {
        const level = levelFromTotalXp(totalXp);
        const floor = thresholdForLevel(level);
        const ceiling = thresholdForLevel(level + 1);
        const currentInLevel = totalXp - floor;
        const neededForLevel = ceiling - floor;
        const percent =
          neededForLevel <= 0 ? 100 : Math.min(100, (currentInLevel / neededForLevel) * 100);
        return { level, currentInLevel, neededForLevel, percent };
      }

      /* ═══════════════════════════════════════════════════════════════
         LocalStorage
      ═══════════════════════════════════════════════════════════════ */
      let state = loadAppData();
      let currentView = 'home';
      let selectedGameId = null;
      let selectedProjectId = null;

      function loadAppData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return createInitialAppData();
          const parsed = JSON.parse(raw);
          if (parsed) return migrateAppData(parsed);
        } catch (e) {
          console.warn('load failed', e);
        }
        return createInitialAppData();
      }

      function saveAppData() {
        state.developerStats.level = levelFromTotalXp(state.developerStats.totalXp);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        render();
      }

      function persist() {
        saveAppData();
      }

      /* ═══════════════════════════════════════════════════════════════
         유틸
      ═══════════════════════════════════════════════════════════════ */
      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function nowIso() {
        return new Date().toISOString();
      }

      function todayStr() {
        return new Date().toISOString().slice(0, 10);
      }

      function fmtDateOnly(dateStr) {
        if (!dateStr) return '';
        const d = parseDateStr(dateStr);
        return d.toLocaleDateString('ko-KR', {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
        });
      }

      function parseDateStr(s) {
        if (!s) return new Date();
        if (s.length >= 10 && s[4] === '-') {
          const [y, m, d] = s.slice(0, 10).split('-').map(Number);
          return new Date(y, m - 1, d);
        }
        return new Date(s);
      }

      /** 접속 기록 날짜 (YYYY-MM-DD) */
      function accessLogDate(log) {
        if (!log) return '';
        if (log.playedDate) return log.playedDate;
        if (log.playedAt) return log.playedAt.slice(0, 10);
        return '';
      }

      function fmtDate(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return d.toLocaleString('ko-KR', {
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });
      }

      function statusLabel(s) {
        const found = PROJECT_STATUSES.find((x) => x.id === s);
        if (found) return found.label;
        return { planned: '백로그', in_progress: '개발 중', completed: '출시 완료' }[s] || s;
      }

      function statusDisplay(p) {
        let t = statusLabel(p.status);
        const def = PROJECT_STATUSES.find((s) => s.id === p.status);
        if (def && def.hasPercent && p.progressPercent != null) {
          t += ' ' + p.progressPercent + '%';
        }
        return t;
      }

      function isActiveProject(p) {
        return ['scheduled', 'planning', 'development', 'testing', 'closing'].includes(p.status);
      }

      function countAccessThisWeek(game) {
        const labels = getWeekLabels(1);
        const wk = labels[0];
        return (game.accessLogs || []).filter((l) => weekKey(accessLogDate(l)) === wk).length;
      }

      function weekKey(d) {
        const x = parseDateStr(typeof d === 'string' && d.length === 10 ? d : d);
        const day = x.getDay();
        const diff = x.getDate() - day + (day === 0 ? -6 : 1);
        const mon = new Date(x.setDate(diff));
        return mon.toISOString().slice(0, 10);
      }

      function getWeekLabels(n) {
        const labels = [];
        const now = new Date();
        for (let i = n - 1; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(d.getDate() - i * 7);
          labels.push(weekKey(d.toISOString()));
        }
        return labels;
      }

      function countAccessByWeek(game, weeks) {
        const labels = getWeekLabels(weeks);
        const counts = labels.map(() => 0);
        (game.accessLogs || []).forEach((log) => {
          const wk = weekKey(accessLogDate(log));
          const idx = labels.indexOf(wk);
          if (idx >= 0) counts[idx]++;
        });
        return { labels, counts };
      }

      function avgDaysBetweenAccess(game) {
        const logs = [...(game.accessLogs || [])].sort((a, b) =>
          accessLogDate(b).localeCompare(accessLogDate(a))
        );
        if (logs.length < 2) return null;
        let sum = 0;
        for (let i = 1; i < logs.length; i++) {
          sum +=
            (parseDateStr(accessLogDate(logs[i])) - parseDateStr(accessLogDate(logs[i - 1]))) /
            86400000;
        }
        return (sum / (logs.length - 1)).toFixed(1);
      }

      function drawWeeklyChart(canvasId, games, weeks) {
        const canvas = document.getElementById(canvasId);
        if (!canvas || !games.length) return;
        const labels = getWeekLabels(weeks);
        const series = games.map((g, i) => ({
          game: g,
          color: ['#34d399', '#5ce1e6', '#a78bfa', '#fbbf24', '#f87171', '#fb923c'][i % 6],
          counts: countAccessByWeek(g, weeks).counts,
        }));
        const max = Math.max(1, ...series.flatMap((s) => s.counts));
        const dpr = window.devicePixelRatio || 1;
        const W = canvas.clientWidth || 600;
        const H = 200;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.fillStyle = '#0f1419';
        ctx.fillRect(0, 0, W, H);
        const pad = { l: 36, r: 12, t: 12, b: 28 };
        const plotW = W - pad.l - pad.r;
        const plotH = H - pad.t - pad.b;
        const barGroupW = plotW / labels.length;
        const barW = Math.max(4, (barGroupW / series.length) * 0.7);
        ctx.strokeStyle = '#2d3a4f';
        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
          const y = pad.t + (plotH * i) / 4;
          ctx.beginPath();
          ctx.moveTo(pad.l, y);
          ctx.lineTo(W - pad.r, y);
          ctx.stroke();
          ctx.fillStyle = '#8b9cb3';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText(String(Math.round(max - (max * i) / 4)), pad.l - 4, y + 3);
        }
        labels.forEach((lb, wi) => {
          const gx = pad.l + wi * barGroupW + barGroupW / 2;
          ctx.fillStyle = '#8b9cb3';
          ctx.font = '9px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(lb.slice(5), gx, H - 6);
          series.forEach((s, si) => {
            const v = s.counts[wi];
            const bh = (v / max) * plotH;
            const x = pad.l + wi * barGroupW + si * barW + (barGroupW - series.length * barW) / 2;
            const y = pad.t + plotH - bh;
            ctx.fillStyle = s.color;
            ctx.fillRect(x, y, barW, bh);
          });
        });
      }

      function drawTrendLine(canvasId, game, weeks) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const { counts } = countAccessByWeek(game, weeks);
        const max = Math.max(1, ...counts);
        const dpr = window.devicePixelRatio || 1;
        const W = canvas.clientWidth || 400;
        const H = 140;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.fillStyle = '#0f1419';
        ctx.fillRect(0, 0, W, H);
        const pad = { l: 28, r: 12, t: 12, b: 24 };
        const plotW = W - pad.l - pad.r;
        const plotH = H - pad.t - pad.b;
        const pts = counts.map((v, i) => ({
          x: pad.l + (i / Math.max(1, counts.length - 1)) * plotW,
          y: pad.t + plotH - (v / max) * plotH,
        }));
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 2;
        ctx.beginPath();
        pts.forEach((p, i) => {
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();
        pts.forEach((p) => {
          ctx.fillStyle = '#34d399';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove('show'), 2200);
      }

      function addXp(amount, source, referenceId) {
        const stats = state.developerStats;
        const prevLevel = levelFromTotalXp(stats.totalXp);
        stats.totalXp += amount;
        const newLevel = levelFromTotalXp(stats.totalXp);
        stats.level = newLevel;
        if (!stats.recentXpEvents) stats.recentXpEvents = [];
        stats.recentXpEvents.unshift({
          id: uid(),
          at: nowIso(),
          amount,
          source,
          referenceId,
        });
        stats.recentXpEvents = stats.recentXpEvents.slice(0, 20);
        if (newLevel > prevLevel) showToast('🎉 레벨 업! Lv.' + newLevel);
        else showToast('+' + amount + ' XP');
      }

      function xpBarHtml(totalXp) {
        const p = xpProgressInLevel(totalXp);
        return (
          '<div class="xp-bar-wrap">' +
          '<div class="xp-bar-label"><span>Lv.' +
          p.level +
          '</span><span>' +
          p.currentInLevel +
          ' / ' +
          p.neededForLevel +
          ' XP</span></div>' +
          '<div class="xp-bar"><div class="xp-bar-fill" style="width:' +
          p.percent +
          '%"></div></div></div>'
        );
      }

      function esc(s) {
        if (s == null) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

                  .join('') +
                '</ul>'
              : '<p class="empty">작업 없음</p>') +
            '<h3 style="margin-top:1rem">💡 프로젝트 아이디어</h3>' +
            '<div class="row"><label class="muted" style="font-size:0.85rem">기록 날짜</label>' +
            '<input type="date" id="proj-idea-date" value="' +
            todayStr() +
            '" style="max-width:160px;margin-bottom:0"></div>' +
            '<textarea id="proj-idea-body" placeholder="아이디어 내용..."></textarea>' +
            '<button class="btn btn-sm btn-dev" data-action="add-proj-idea" data-id="' +
            sel.id +
            '">메모 추가</button>' +
            '<div style="margin-top:0.65rem">' +
            ideaListHtml +
            '</div></div>';
        } else if (projects.length) {
          projDetail = '<p class="empty card">프로젝트를 선택하세요.</p>';
        }

        const xpEvents = (stats.recentXpEvents || []).slice(0, 5);
        const eventsHtml =
          xpEvents.length === 0
            ? '<p class="empty">XP 기록 없음</p>'
            : '<ul class="list">' +
              xpEvents
                .map(
                  (e) =>
                    '<li>+' +
                    e.amount +
                    ' XP · 작업 완료 · ' +
                    fmtDate(e.at) +
                    '</li>'
                )
                .join('') +
              '</ul>';

        return (
          '<div class="section-title">🛠️ 개발자</div>' +
          '<div class="card"><h2>RPG 스탯</h2>' +
          xpBarHtml(stats.totalXp) +
          '<p class="muted">누적 ' +
          stats.totalXp +
          ' XP · 작업 완료 +' +
          XP_REWARDS.task_complete +
          '</p><h3 style="margin-top:0.65rem">최근 XP</h3>' +
          eventsHtml +
          '</div>' +
          '<div class="card"><h3>프로젝트 등록</h3>' +
          '<div class="row"><input id="new-proj-name" placeholder="프로젝트명">' +
          '<button class="btn btn-dev" data-action="add-project">등록</button></div></div>' +
          '<div class="split"><div class="card"><h3>프로젝트</h3>' +
          projList +
          '</div><div>' +
          projDetail +
          '</div></div>'
        );
      }

      /* ═══════════════════════════════════════════════════════════════
         액션 핸들러
      ═══════════════════════════════════════════════════════════════ */
      function baseEntity() {
        const t = nowIso();
        return { id: uid(), createdAt: t, updatedAt: t };
      }

      const actions = {
        'nav-view'(el) {
          currentView = el.dataset.view;
          render();
        },
        'add-game'() {
          const title = document.getElementById('new-game-title').value.trim();
          if (!title) return alert('게임 이름을 입력하세요.');
          const g = {
            ...baseEntity(),
            title,
            platform: document.getElementById('new-game-platform').value.trim() || undefined,
            memo: '',
            checklist: [],
            accessLogs: [],
            events: [],
          };
          state.games.push(g);
          selectedGameId = g.id;
          persist();
        },
        'select-game'(el) {
          selectedGameId = el.dataset.id;
          render();
        },
        'delete-game'(el) {
          if (!confirm('이 게임을 삭제할까요?')) return;
          state.games = state.games.filter((g) => g.id !== el.dataset.id);
          if (selectedGameId === el.dataset.id) selectedGameId = null;
          persist();
        },
        'save-game-meta'(el) {
          const g = state.games.find((x) => x.id === el.dataset.id);
          if (!g) return;
          g.title = document.getElementById('game-title-edit').value.trim() || g.title;
          g.platform = document.getElementById('game-platform-edit').value.trim() || undefined;
          g.updatedAt = nowIso();
          persist();
        },
        'add-quest'(el) {
          const g = state.games.find((x) => x.id === el.dataset.id);
          const label = document.getElementById('new-quest').value.trim();
          if (!g || !label) return;
          g.checklist.push({
            ...baseEntity(),
            label,
            done: false,
            date: todayStr(),
          });
          g.updatedAt = nowIso();
          persist();
        },
        'toggle-quest'(el) {
          const g = state.games.find((x) => x.id === el.dataset.gid);
          const c = g && g.checklist.find((x) => x.id === el.dataset.cid);
          if (!c) return;
          c.done = el.checked;
          c.updatedAt = nowIso();
          g.updatedAt = nowIso();
          persist();
        },
        'del-quest'(el) {
          const g = state.games.find((x) => x.id === el.dataset.gid);
          if (!g) return;
          g.checklist = g.checklist.filter((c) => c.id !== el.dataset.cid);
          g.updatedAt = nowIso();
          persist();
        },
        'save-memo'(el) {
          const g = state.games.find((x) => x.id === el.dataset.id);
          if (!g) return;
          g.memo = document.getElementById('game-memo').value;
          g.updatedAt = nowIso();
          persist();
        },
        'add-access'(el) {
          const g = state.games.find((x) => x.id === el.dataset.id);
          if (!g) return;
          const playedDate = document.getElementById('access-date').value;
          if (!playedDate) return alert('접속 날짜를 선택하세요.');
          g.accessLogs.unshift({
            id: uid(),
            playedDate,
            memo: document.getElementById('access-memo').value.trim() || undefined,
          });
          g.updatedAt = nowIso();
          document.getElementById('access-memo').value = '';
          persist();
        },
        'del-access'(el) {
          const g = state.games.find((x) => x.id === el.dataset.gid);
          if (!g) return;
          g.accessLogs = g.accessLogs.filter((l) => l.id !== el.dataset.lid);
          g.updatedAt = nowIso();
          persist();
        },
        'add-event'(el) {
          const g = state.games.find((x) => x.id === el.dataset.id);
          const title = document.getElementById('event-title').value.trim();
          const startDate = document.getElementById('event-start').value;
          if (!g || !title || !startDate) return alert('이벤트명과 시작일을 입력하세요.');
          if (!g.events) g.events = [];
          g.events.unshift({
            id: uid(),
            title,
            startDate,
            endDate: document.getElementById('event-end').value || undefined,
            note: document.getElementById('event-note').value.trim() || undefined,
            createdAt: nowIso(),
          });
          g.updatedAt = nowIso();
          document.getElementById('event-title').value = '';
          document.getElementById('event-note').value = '';
          persist();
        },
        'del-event'(el) {
          const g = state.games.find((x) => x.id === el.dataset.gid);
          if (!g || !g.events) return;
          g.events = g.events.filter((e) => e.id !== el.dataset.eid);
          g.updatedAt = nowIso();
          persist();
        },
        'set-chart-weeks'(el) {
          chartWeeks = parseInt(el.dataset.weeks, 10) || 8;
          render();
        },
        'add-project'() {
          const name = document.getElementById('new-proj-name').value.trim();
          if (!name) return alert('프로젝트명을 입력하세요.');
          const p = {
            ...baseEntity(),
            name,
            status: 'scheduled',
            tasks: [],
            ideas: [],
          };
          state.devProjects.push(p);
          selectedProjectId = p.id;
          persist();
        },
        'select-project'(el) {
          selectedProjectId = el.dataset.id;
          render();
        },
        'save-project'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.id);
          if (!p) return;
          p.name = document.getElementById('proj-name').value.trim() || p.name;
          p.status = document.getElementById('proj-status').value;
          const def = PROJECT_STATUSES.find((s) => s.id === p.status);
          if (def && def.hasPercent) {
            const prog = document.getElementById('proj-progress');
            p.progressPercent = prog
              ? Math.min(100, Math.max(0, parseInt(prog.value, 10) || 0))
              : p.progressPercent ?? 0;
          } else {
            delete p.progressPercent;
          }
          p.updatedAt = nowIso();
          persist();
        },
        'preview-progress'(el) {
          const val = document.getElementById('proj-progress-val');
          if (val) val.textContent = el.value + '%';
        },
        'delete-project'(el) {
          if (!confirm('프로젝트를 삭제할까요?')) return;
          state.devProjects = state.devProjects.filter((p) => p.id !== el.dataset.id);
          if (selectedProjectId === el.dataset.id) selectedProjectId = null;
          persist();
        },
        'add-task'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.id);
          const title = document.getElementById('new-task').value.trim();
          if (!p || !title) return;
          p.tasks.push({ ...baseEntity(), title, done: false });
          p.updatedAt = nowIso();
          persist();
        },
        'toggle-task'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          const t = p && p.tasks.find((x) => x.id === el.dataset.tid);
          if (!t) return;
          t.done = el.checked;
          t.updatedAt = nowIso();
          if (t.done && !t.completedAt) {
            t.completedAt = nowIso();
            addXp(XP_REWARDS.task_complete, 'task_complete', t.id);
          }
          p.updatedAt = nowIso();
          persist();
        },
        'save-task'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          const t = p && p.tasks.find((x) => x.id === el.dataset.tid);
          if (!t) return;
          const inp = document.getElementById('task-title-' + t.id);
          const title = (inp && inp.value.trim()) || t.title;
          if (!title) return alert('작업 제목을 입력하세요.');
          t.title = title;
          t.updatedAt = nowIso();
          p.updatedAt = nowIso();
          showToast('작업 수정됨');
          persist();
        },
        'del-task'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          if (!p) return;
          p.tasks = p.tasks.filter((t) => t.id !== el.dataset.tid);
          p.updatedAt = nowIso();
          persist();
        },
        'add-proj-idea'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.id);
          const memoDate = document.getElementById('proj-idea-date').value || todayStr();
          const body = document.getElementById('proj-idea-body').value.trim();
          if (!p) return;
          if (!body) return alert('내용을 입력하세요.');
          if (!p.ideas) p.ideas = [];
          p.ideas.unshift({
            ...baseEntity(),
            memoDate,
            body,
            pinned: false,
          });
          p.updatedAt = nowIso();
          document.getElementById('proj-idea-body').value = '';
          document.getElementById('proj-idea-date').value = todayStr();
          persist();
        },
        'save-proj-idea'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          const m = p && p.ideas && p.ideas.find((x) => x.id === el.dataset.iid);
          if (!m) return;
          const dateEl = document.querySelector('.idea-date-edit[data-iid="' + m.id + '"]');
          const bodyEl = document.querySelector('.idea-body-edit[data-iid="' + m.id + '"]');
          m.memoDate = (dateEl && dateEl.value) || m.memoDate || todayStr();
          m.body = bodyEl ? bodyEl.value : m.body;
          m.updatedAt = nowIso();
          p.updatedAt = nowIso();
          showToast('메모 저장됨');
          persist();
        },
        'toggle-proj-pin'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          const m = p && p.ideas && p.ideas.find((x) => x.id === el.dataset.iid);
          if (!m) return;
          m.pinned = !m.pinned;
          m.updatedAt = nowIso();
          p.updatedAt = nowIso();
          persist();
        },
        'del-proj-idea'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          if (!p || !p.ideas) return;
          p.ideas = p.ideas.filter((m) => m.id !== el.dataset.iid);
          p.updatedAt = nowIso();
          persist();
        },
      };

      document.body.addEventListener('click', (e) => {
        const el = e.target.closest('[data-action]');
        if (!el) return;
        const fn = actions[el.dataset.action];
        if (fn) fn(el);
      });

      document.body.addEventListener('change', (e) => {
        if (e.target.dataset.action) {
          const fn = actions[e.target.dataset.action];
          if (fn) fn(e.target);
        }
      });

      document.body.addEventListener('input', (e) => {
        if (e.target.dataset.action === 'preview-progress') {
          actions['preview-progress'](e.target);
        }
      });

      /* ═══════════════════════════════════════════════════════════════
         렌더
      ═══════════════════════════════════════════════════════════════ */
      function renderNav() {
        const views = [
          { id: 'home', label: '🏠 홈' },
          { id: 'player', label: '🎮 플레이어' },
          { id: 'developer', label: '🛠️ 개발자' },
        ];
        document.getElementById('nav').innerHTML = views
          .map(
            (v) =>
              '<button type="button" data-action="nav-view" data-view="' +
              v.id +
              '" class="' +
              (currentView === v.id ? 'active' : '') +
              '">' +
              v.label +
              '</button>'
          )
          .join('');
      }

      function render() {
        renderNav();
        const main = document.getElementById('main');
        if (currentView === 'home') main.innerHTML = renderHome();
        else if (currentView === 'player') main.innerHTML = renderPlayer();
        else main.innerHTML = renderDeveloper();
      }

      render();
    </script>
  </body>
</html>
