<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Life Manager</title>
    <style>
      :root {
        --bg: #0f1419;
        --surface: #1a2332;
        --surface2: #243044;
        --border: #2d3a4f;
        --text: #e8edf4;
        --muted: #8b9cb3;
        --accent: #5ce1e6;
        --accent2: #a78bfa;
        --player: #34d399;
        --dev: #fbbf24;
        --danger: #f87171;
        --radius: 10px;
        --font: 'Segoe UI', system-ui, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.5;
      }
      .app { max-width: 960px; margin: 0 auto; padding: 1rem 1.25rem 2rem; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border);
      }
      header h1 { font-size: 1.35rem; font-weight: 700; }
      header h1 span { color: var(--accent); }
      nav {
        display: flex;
        gap: 0.35rem;
        background: var(--surface);
        padding: 0.35rem;
        border-radius: var(--radius);
        border: 1px solid var(--border);
      }
      nav button {
        border: none;
        background: transparent;
        color: var(--muted);
        padding: 0.5rem 1rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        transition: 0.15s;
      }
      nav button.active {
        background: var(--surface2);
        color: var(--text);
      }
      nav button[data-view='developer'].active { color: var(--dev); }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1rem 1.1rem;
        margin-bottom: 0.85rem;
      }
      .card h2, .card h3 {
        font-size: 0.95rem;
        margin-bottom: 0.65rem;
        color: var(--accent);
      }
      .card h3 { font-size: 0.88rem; color: var(--muted); }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; }
      @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
      .muted { color: var(--muted); font-size: 0.85rem; }
      .empty { color: var(--muted); font-size: 0.88rem; padding: 0.5rem 0; }
      input, textarea, select {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.5rem 0.65rem;
        border-radius: 8px;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
      }
      textarea { min-height: 72px; resize: vertical; }
      .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.5rem; }
      .row input, .row select { flex: 1; min-width: 120px; margin-bottom: 0; }
      button.btn {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.45rem 0.85rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 600;
      }
      button.btn:hover { border-color: var(--accent); }
      button.btn-primary { background: #1e3a5f; border-color: var(--accent); color: var(--accent); }
      button.btn-dev { border-color: var(--dev); color: var(--dev); }
      button.btn-danger { border-color: var(--danger); color: var(--danger); }
      button.btn-sm { padding: 0.3rem 0.55rem; font-size: 0.78rem; }
      ul.list { list-style: none; }
      ul.list li {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        padding: 0.45rem 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.88rem;
      }
      ul.list li:last-child { border-bottom: none; }
      .project-item {
        cursor: pointer;
        padding: 0.55rem 0.65rem;
        border-radius: 8px;
        margin-bottom: 0.35rem;
        border: 1px solid transparent;
      }
      .project-item:hover { background: var(--surface2); }
      .project-item.selected {
        border-color: var(--accent);
        background: var(--surface2);
      }
      .badge {
        display: inline-block;
        font-size: 0.72rem;
        padding: 0.15rem 0.45rem;
        border-radius: 6px;
        background: var(--surface2);
        color: var(--muted);
      }
      .badge-planned { color: #93c5fd; }
      .badge-in_progress { color: var(--dev); }
      .badge-completed { color: var(--player); }
      .xp-bar-wrap { margin-top: 0.5rem; }
      .xp-bar-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.82rem;
        margin-bottom: 0.35rem;
      }
      .xp-bar {
        height: 12px;
        background: var(--bg);
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .xp-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--dev), var(--accent2));
        border-radius: 6px;
        transition: width 0.3s;
      }
      .toast {
        position: fixed;
        bottom: 1.25rem;
        right: 1.25rem;
        background: var(--surface2);
        border: 1px solid var(--accent);
        color: var(--accent);
        padding: 0.65rem 1rem;
        border-radius: var(--radius);
        font-size: 0.88rem;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
        z-index: 100;
      }
      .toast.show { opacity: 1; }
      label.chk { display: flex; align-items: center; gap: 0.45rem; cursor: pointer; flex: 1; }
      label.chk input { width: auto; margin: 0; }
      .done-text { text-decoration: line-through; color: var(--muted); }
      .split { display: grid; grid-template-columns: 220px 1fr; gap: 1rem; }
      @media (max-width: 720px) { .split { grid-template-columns: 1fr; } }
      .section-title {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 0.85rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .badge-scheduled { color: #93c5fd; }
      .badge-planning { color: #c4b5fd; }
      .badge-development { color: var(--dev); }
      .badge-testing { color: #fb923c; }
      .badge-closing { color: #f472b6; }
      .badge-completed { color: var(--player); }
      .badge-stopped { color: var(--muted); }
      .progress-block { margin: 0.5rem 0 0.75rem; }
      .progress-block input[type='range'] { width: 100%; margin: 0.35rem 0; }
      .progress-block .progress-val { font-size: 0.85rem; color: var(--dev); font-weight: 600; }
      .task-row { flex-wrap: wrap; align-items: center !important; }
      .task-row input.task-title-input { flex: 1; min-width: 140px; margin-bottom: 0; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>🎮 <span>Game Life</span> Manager</h1>
        <nav id="nav"></nav>
      </header>
      <main id="main"></main>
    </div>
    <div id="toast" class="toast"></div>

    <script>
      /* ═══════════════════════════════════════════════════════════════
         데이터 구조 (src/types/index.ts)
      ═══════════════════════════════════════════════════════════════ */
      const STORAGE_KEY = 'game-life-manager:v1';

      const PROJECT_STATUSES = [
        { id: 'scheduled', label: '예정', hasPercent: false },
        { id: 'planning', label: '기획', hasPercent: true },
        { id: 'development', label: '개발', hasPercent: true },
        { id: 'testing', label: '테스트', hasPercent: true },
        { id: 'closing', label: '마감', hasPercent: true },
        { id: 'completed', label: '완료', hasPercent: false },
        { id: 'stopped', label: '중지', hasPercent: false },
      ];

      function createInitialAppData() {
        return {
          version: 3,
          devProjects: [],
          developerStats: { totalXp: 0, level: 1, recentXpEvents: [] },
        };
      }

      function migrateAppData(parsed) {
        if (!parsed || typeof parsed !== 'object') return createInitialAppData();

        delete parsed.games;

        const statusMap = {
          planned: 'scheduled',
          backlog: 'scheduled',
          scheduled: 'scheduled',
          design: 'planning',
          planning: 'planning',
          dev: 'development',
          development: 'development',
          in_progress: 'development',
          test: 'testing',
          testing: 'testing',
          polish: 'closing',
          closing: 'closing',
          released: 'completed',
          completed: 'completed',
          hold: 'stopped',
          stopped: 'stopped',
        };

        parsed.devProjects = (parsed.devProjects || []).map((p) => {
          const st = statusMap[p.status] || p.status || 'scheduled';
          const def = PROJECT_STATUSES.find((s) => s.id === st) || PROJECT_STATUSES[0];
          const ideas = (p.ideas || []).map((idea) => ({
            id: idea.id || uid(),
            body: idea.body || idea.title || '',
            memoDate:
              idea.memoDate ||
              (idea.createdAt && idea.createdAt.slice(0, 10)) ||
              todayStr(),
            pinned: !!idea.pinned,
            createdAt: idea.createdAt || nowIso(),
            updatedAt: idea.updatedAt || nowIso(),
          }));
          return {
            ...p,
            status: st,
            progressPercent: def.hasPercent
              ? Math.min(100, Math.max(0, p.progressPercent ?? 0))
              : undefined,
            ideas,
            tasks: p.tasks || [],
          };
        });

        if (parsed.ideaMemos && parsed.ideaMemos.length) {
          parsed.ideaMemos.forEach((m) => {
            const pid = m.projectId;
            const proj = pid && parsed.devProjects.find((x) => x.id === pid);
            const idea = {
              id: m.id || uid(),
              body: m.body || m.title || '',
              memoDate:
                m.memoDate ||
                (m.createdAt && m.createdAt.slice(0, 10)) ||
                todayStr(),
              pinned: !!m.pinned,
              createdAt: m.createdAt || nowIso(),
              updatedAt: m.updatedAt || nowIso(),
            };
            if (proj) proj.ideas.push(idea);
            else if (parsed.devProjects[0]) parsed.devProjects[0].ideas.push(idea);
          });
        }

        delete parsed.devJournals;
        delete parsed.ideaMemos;
        parsed.version = 3;
        parsed.developerStats = parsed.developerStats || {
          totalXp: 0,
          level: 1,
          recentXpEvents: [],
        };
        return parsed;
      }

      /* ═══════════════════════════════════════════════════════════════
         RPG (src/types/rpg.ts)
      ═══════════════════════════════════════════════════════════════ */
      const XP_REWARDS = { task_complete: 5 };
      const LEVEL_THRESHOLDS = [0, 100, 250, 450, 700, 1000, 1350, 1750, 2200, 2700];

      function thresholdForLevel(level) {
        if (level <= 1) return 0;
        if (level - 1 < LEVEL_THRESHOLDS.length) return LEVEL_THRESHOLDS[level - 1];
        const lastDefined = LEVEL_THRESHOLDS.length;
        let lastXp = LEVEL_THRESHOLDS[lastDefined - 1];
        let prevXp = LEVEL_THRESHOLDS[lastDefined - 2];
        let gap = lastXp - prevXp;
        let xp = lastXp;
        for (let lv = lastDefined + 1; lv <= level; lv++) {
          gap += 50;
          xp += gap;
        }
        return xp;
      }

      function levelFromTotalXp(totalXp) {
        let level = 1;
        while (thresholdForLevel(level + 1) <= totalXp) level++;
        return level;
      }

      function xpProgressInLevel(totalXp) {
        const level = levelFromTotalXp(totalXp);
        const floor = thresholdForLevel(level);
        const ceiling = thresholdForLevel(level + 1);
        const currentInLevel = totalXp - floor;
        const neededForLevel = ceiling - floor;
        const percent =
          neededForLevel <= 0 ? 100 : Math.min(100, (currentInLevel / neededForLevel) * 100);
        return { level, currentInLevel, neededForLevel, percent };
      }

      /* ═══════════════════════════════════════════════════════════════
         LocalStorage
      ═══════════════════════════════════════════════════════════════ */
      let state = loadAppData();
      let currentView = 'home';
      let selectedProjectId = null;

      function loadAppData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return createInitialAppData();
          const parsed = JSON.parse(raw);
          if (parsed) return migrateAppData(parsed);
        } catch (e) {
          console.warn('load failed', e);
        }
        return createInitialAppData();
      }

      function saveAppData() {
        state.developerStats.level = levelFromTotalXp(state.developerStats.totalXp);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        render();
      }

      function persist() {
        saveAppData();
      }

      /* ═══════════════════════════════════════════════════════════════
         유틸
      ═══════════════════════════════════════════════════════════════ */
      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function nowIso() {
        return new Date().toISOString();
      }

      function todayStr() {
        return new Date().toISOString().slice(0, 10);
      }

      function fmtDate(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return d.toLocaleString('ko-KR', {
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });
      }

      function statusLabel(s) {
        const found = PROJECT_STATUSES.find((x) => x.id === s);
        if (found) return found.label;
        return { planned: '백로그', in_progress: '개발 중', completed: '출시 완료' }[s] || s;
      }

      function statusDisplay(p) {
        let t = statusLabel(p.status);
        const def = PROJECT_STATUSES.find((s) => s.id === p.status);
        if (def && def.hasPercent && p.progressPercent != null) {
          t += ' ' + p.progressPercent + '%';
        }
        return t;
      }

      function isActiveProject(p) {
        return ['scheduled', 'planning', 'development', 'testing', 'closing'].includes(p.status);
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove('show'), 2200);
      }

      function addXp(amount, source, referenceId) {
        const stats = state.developerStats;
        const prevLevel = levelFromTotalXp(stats.totalXp);
        stats.totalXp += amount;
        const newLevel = levelFromTotalXp(stats.totalXp);
        stats.level = newLevel;
        if (!stats.recentXpEvents) stats.recentXpEvents = [];
        stats.recentXpEvents.unshift({
          id: uid(),
          at: nowIso(),
          amount,
          source,
          referenceId,
        });
        stats.recentXpEvents = stats.recentXpEvents.slice(0, 20);
        if (newLevel > prevLevel) showToast('🎉 레벨 업! Lv.' + newLevel);
        else showToast('+' + amount + ' XP');
      }

      function xpBarHtml(totalXp) {
        const p = xpProgressInLevel(totalXp);
        return (
          '<div class="xp-bar-wrap">' +
          '<div class="xp-bar-label"><span>Lv.' +
          p.level +
          '</span><span>' +
          p.currentInLevel +
          ' / ' +
          p.neededForLevel +
          ' XP</span></div>' +
          '<div class="xp-bar"><div class="xp-bar-fill" style="width:' +
          p.percent +
          '%"></div></div></div>'
        );
      }

      function esc(s) {
        if (s == null) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      /* ═══════════════════════════════════════════════════════════════
         홈 대시보드
      ═══════════════════════════════════════════════════════════════ */
      function renderHome() {
        const activeProjects = state.devProjects.filter(isActiveProject);
        const openTasks = state.devProjects.reduce(
          (n, p) => n + p.tasks.filter((t) => !t.done).length,
          0
        );
        const stats = state.developerStats;

        let projHtml =
          activeProjects.length === 0
            ? '<p class="empty">진행 중인 프로젝트가 없습니다.</p>'
            : '<ul class="list">' +
              activeProjects
                .map(
                  (p) =>
                    '<li><strong>' +
                    esc(p.name) +
                    '</strong> <span class="badge badge-' +
                    p.status +
                    '">' +
                    statusDisplay(p) +
                    '</span> · 작업 ' +
                    p.tasks.filter((t) => !t.done).length +
                    '개 남음</li>'
                )
                .join('') +
              '</ul>';

        return (
          '<div class="section-title">🏠 홈 대시보드</div>' +
          '<div class="card"><h2>🛠️ 개발자 요약</h2>' +
          '<h3>진행 중 프로젝트</h3>' +
          projHtml +
          '<p class="muted" style="margin:0.5rem 0">미완료 작업: <strong>' +
          openTasks +
          '</strong>개</p>' +
          xpBarHtml(stats.totalXp) +
          '<p class="muted" style="margin-top:0.5rem">누적 XP: ' +
          stats.totalXp +
          '</p></div>'
        );
      }

      /* ═══════════════════════════════════════════════════════════════
         개발자 페이지
      ═══════════════════════════════════════════════════════════════ */
      function renderDeveloper() {
        const stats = state.developerStats;
        const projects = state.devProjects;
        const sel = projects.find((p) => p.id === selectedProjectId);
        const statusDef = sel && PROJECT_STATUSES.find((s) => s.id === sel.status);
        const showProgress = statusDef && statusDef.hasPercent;

        let projList = projects.length
          ? projects
              .map(
                (p) =>
                  '<div class="project-item' +
                  (p.id === selectedProjectId ? ' selected' : '') +
                  '" data-action="select-project" data-id="' +
                  p.id +
                  '"><strong>' +
                  esc(p.name) +
                  '</strong> <span class="badge badge-' +
                  p.status +
                  '">' +
                  statusDisplay(p) +
                  '</span></div>'
              )
              .join('')
          : '<p class="empty">프로젝트 없음</p>';

        let projDetail = '';
        if (sel) {
          const tasks = sel.tasks || [];
          const ideas = [...(sel.ideas || [])].sort((a, b) => {
            if (a.pinned && !b.pinned) return -1;
            if (!a.pinned && b.pinned) return 1;
            const da = a.memoDate || '';
            const db = b.memoDate || '';
            if (db !== da) return db > da ? 1 : -1;
            return b.updatedAt > a.updatedAt ? 1 : -1;
          });

          const ideaListHtml = ideas.length
            ? ideas
                .map(
                  (m) =>
                    '<div class="card" style="padding:0.75rem;margin-bottom:0.5rem">' +
                    (m.pinned ? '📌 ' : '') +
                    '<div class="row" style="margin-bottom:0.35rem">' +
                    '<label class="muted" style="font-size:0.82rem">날짜</label>' +
                    '<input type="date" class="idea-date-edit" data-iid="' +
                    m.id +
                    '" value="' +
                    esc(m.memoDate || todayStr()) +
                    '" style="max-width:160px;margin-bottom:0"></div>' +
                    '<textarea class="idea-body-edit" data-iid="' +
                    m.id +
                    '" placeholder="아이디어 내용">' +
                    esc(m.body) +
                    '</textarea>' +
                    '<button class="btn btn-sm btn-dev" data-action="save-proj-idea" data-pid="' +
                    sel.id +
                    '" data-iid="' +
                    m.id +
                    '">저장</button> ' +
                    '<button class="btn btn-sm" data-action="toggle-proj-pin" data-pid="' +
                    sel.id +
                    '" data-iid="' +
                    m.id +
                    '">' +
                    (m.pinned ? '고정 해제' : '고정') +
                    '</button> ' +
                    '<button class="btn btn-sm btn-danger" data-action="del-proj-idea" data-pid="' +
                    sel.id +
                    '" data-iid="' +
                    m.id +
                    '">삭제</button></div>'
                )
                .join('')
            : '<p class="empty">아이디어 메모 없음</p>';

          projDetail =
            '<div class="card">' +
            '<h2>' +
            esc(sel.name) +
            '</h2>' +
            '<div class="row">' +
            '<input id="proj-name" value="' +
            esc(sel.name) +
            '">' +
            '<select id="proj-status">' +
            PROJECT_STATUSES.map(
              (s) =>
                '<option value="' +
                s.id +
                '"' +
                (sel.status === s.id ? ' selected' : '') +
                '>' +
                s.label +
                (s.hasPercent ? ' (진행률 %)' : '') +
                '</option>'
            ).join('') +
            '</select>' +
            '<button class="btn btn-sm btn-dev" data-action="save-project" data-id="' +
            sel.id +
            '">저장</button>' +
            '<button class="btn btn-sm btn-danger" data-action="delete-project" data-id="' +
            sel.id +
            '">삭제</button></div>' +
            (showProgress
              ? '<div class="progress-block" id="proj-progress-wrap">' +
                '<label>진행률 <span class="progress-val" id="proj-progress-val">' +
                (sel.progressPercent ?? 0) +
                '%</span></label>' +
                '<input type="range" id="proj-progress" min="0" max="100" value="' +
                (sel.progressPercent ?? 0) +
                '" data-action="preview-progress">' +
                '</div>'
              : '<p class="muted progress-block">예정·완료·중지는 % 없음. 기획·개발·테스트·마감에서 진행률을 설정하세요.</p>') +
            '<h3>작업 목록</h3>' +
            '<div class="row"><input id="new-task" placeholder="작업 추가">' +
            '<button class="btn btn-sm btn-dev" data-action="add-task" data-id="' +
            sel.id +
            '">추가</button></div>' +
            (tasks.length
              ? '<ul class="list">' +
                tasks
                  .map(
                    (t) =>
                      '<li class="task-row"><label class="chk"><input type="checkbox" data-action="toggle-task" data-pid="' +
                      sel.id +
                      '" data-tid="' +
                      t.id +
                      '"' +
                      (t.done ? ' checked' : '') +
                      '></label>' +
                      '<input class="task-title-input" id="task-title-' +
                      t.id +
                      '" value="' +
                      esc(t.title) +
                      '">' +
                      '<button class="btn btn-sm btn-dev" data-action="save-task" data-pid="' +
                      sel.id +
                      '" data-tid="' +
                      t.id +
                      '">저장</button>' +
                      '<button class="btn btn-sm btn-danger" data-action="del-task" data-pid="' +
                      sel.id +
                      '" data-tid="' +
                      t.id +
                      '">×</button></li>'
                  )
                  .join('') +
                '</ul>'
              : '<p class="empty">작업 없음</p>') +
            '<h3 style="margin-top:1rem">💡 프로젝트 아이디어</h3>' +
            '<div class="row"><label class="muted" style="font-size:0.85rem">기록 날짜</label>' +
            '<input type="date" id="proj-idea-date" value="' +
            todayStr() +
            '" style="max-width:160px;margin-bottom:0"></div>' +
            '<textarea id="proj-idea-body" placeholder="아이디어 내용..."></textarea>' +
            '<button class="btn btn-sm btn-dev" data-action="add-proj-idea" data-id="' +
            sel.id +
            '">메모 추가</button>' +
            '<div style="margin-top:0.65rem">' +
            ideaListHtml +
            '</div></div>';
        } else if (projects.length) {
          projDetail = '<p class="empty card">프로젝트를 선택하세요.</p>';
        }

        const xpEvents = (stats.recentXpEvents || []).slice(0, 5);
        const eventsHtml =
          xpEvents.length === 0
            ? '<p class="empty">XP 기록 없음</p>'
            : '<ul class="list">' +
              xpEvents
                .map(
                  (e) =>
                    '<li>+' +
                    e.amount +
                    ' XP · 작업 완료 · ' +
                    fmtDate(e.at) +
                    '</li>'
                )
                .join('') +
              '</ul>';

        return (
          '<div class="section-title">🛠️ 개발자</div>' +
          '<div class="card"><h2>RPG 스탯</h2>' +
          xpBarHtml(stats.totalXp) +
          '<p class="muted">누적 ' +
          stats.totalXp +
          ' XP · 작업 완료 +' +
          XP_REWARDS.task_complete +
          '</p><h3 style="margin-top:0.65rem">최근 XP</h3>' +
          eventsHtml +
          '</div>' +
          '<div class="card"><h3>프로젝트 등록</h3>' +
          '<div class="row"><input id="new-proj-name" placeholder="프로젝트명">' +
          '<button class="btn btn-dev" data-action="add-project">등록</button></div></div>' +
          '<div class="split"><div class="card"><h3>프로젝트</h3>' +
          projList +
          '</div><div>' +
          projDetail +
          '</div></div>'
        );
      }

      /* ═══════════════════════════════════════════════════════════════
         액션 핸들러
      ═══════════════════════════════════════════════════════════════ */
      function baseEntity() {
        const t = nowIso();
        return { id: uid(), createdAt: t, updatedAt: t };
      }

      const actions = {
        'nav-view'(el) {
          currentView = el.dataset.view;
          render();
        },
        'add-project'() {
          const name = document.getElementById('new-proj-name').value.trim();
          if (!name) return alert('프로젝트명을 입력하세요.');
          const p = {
            ...baseEntity(),
            name,
            status: 'scheduled',
            tasks: [],
            ideas: [],
          };
          state.devProjects.push(p);
          selectedProjectId = p.id;
          persist();
        },
        'select-project'(el) {
          selectedProjectId = el.dataset.id;
          render();
        },
        'save-project'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.id);
          if (!p) return;
          p.name = document.getElementById('proj-name').value.trim() || p.name;
          p.status = document.getElementById('proj-status').value;
          const def = PROJECT_STATUSES.find((s) => s.id === p.status);
          if (def && def.hasPercent) {
            const prog = document.getElementById('proj-progress');
            p.progressPercent = prog
              ? Math.min(100, Math.max(0, parseInt(prog.value, 10) || 0))
              : p.progressPercent ?? 0;
          } else {
            delete p.progressPercent;
          }
          p.updatedAt = nowIso();
          persist();
        },
        'preview-progress'(el) {
          const val = document.getElementById('proj-progress-val');
          if (val) val.textContent = el.value + '%';
        },
        'delete-project'(el) {
          if (!confirm('프로젝트를 삭제할까요?')) return;
          state.devProjects = state.devProjects.filter((p) => p.id !== el.dataset.id);
          if (selectedProjectId === el.dataset.id) selectedProjectId = null;
          persist();
        },
        'add-task'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.id);
          const title = document.getElementById('new-task').value.trim();
          if (!p || !title) return;
          p.tasks.push({ ...baseEntity(), title, done: false });
          p.updatedAt = nowIso();
          persist();
        },
        'toggle-task'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          const t = p && p.tasks.find((x) => x.id === el.dataset.tid);
          if (!t) return;
          t.done = el.checked;
          t.updatedAt = nowIso();
          if (t.done && !t.completedAt) {
            t.completedAt = nowIso();
            addXp(XP_REWARDS.task_complete, 'task_complete', t.id);
          }
          p.updatedAt = nowIso();
          persist();
        },
        'save-task'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          const t = p && p.tasks.find((x) => x.id === el.dataset.tid);
          if (!t) return;
          const inp = document.getElementById('task-title-' + t.id);
          const title = (inp && inp.value.trim()) || t.title;
          if (!title) return alert('작업 제목을 입력하세요.');
          t.title = title;
          t.updatedAt = nowIso();
          p.updatedAt = nowIso();
          showToast('작업 수정됨');
          persist();
        },
        'del-task'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          if (!p) return;
          p.tasks = p.tasks.filter((t) => t.id !== el.dataset.tid);
          p.updatedAt = nowIso();
          persist();
        },
        'add-proj-idea'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.id);
          const memoDate = document.getElementById('proj-idea-date').value || todayStr();
          const body = document.getElementById('proj-idea-body').value.trim();
          if (!p) return;
          if (!body) return alert('내용을 입력하세요.');
          if (!p.ideas) p.ideas = [];
          p.ideas.unshift({
            ...baseEntity(),
            memoDate,
            body,
            pinned: false,
          });
          p.updatedAt = nowIso();
          document.getElementById('proj-idea-body').value = '';
          document.getElementById('proj-idea-date').value = todayStr();
          persist();
        },
        'save-proj-idea'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          const m = p && p.ideas && p.ideas.find((x) => x.id === el.dataset.iid);
          if (!m) return;
          const dateEl = document.querySelector('.idea-date-edit[data-iid="' + m.id + '"]');
          const bodyEl = document.querySelector('.idea-body-edit[data-iid="' + m.id + '"]');
          m.memoDate = (dateEl && dateEl.value) || m.memoDate || todayStr();
          m.body = bodyEl ? bodyEl.value : m.body;
          m.updatedAt = nowIso();
          p.updatedAt = nowIso();
          showToast('메모 저장됨');
          persist();
        },
        'toggle-proj-pin'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          const m = p && p.ideas && p.ideas.find((x) => x.id === el.dataset.iid);
          if (!m) return;
          m.pinned = !m.pinned;
          m.updatedAt = nowIso();
          p.updatedAt = nowIso();
          persist();
        },
        'del-proj-idea'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          if (!p || !p.ideas) return;
          p.ideas = p.ideas.filter((m) => m.id !== el.dataset.iid);
          p.updatedAt = nowIso();
          persist();
        },
      };

      document.body.addEventListener('click', (e) => {
        const el = e.target.closest('[data-action]');
        if (!el) return;
        const fn = actions[el.dataset.action];
        if (fn) fn(el);
      });

      document.body.addEventListener('change', (e) => {
        if (e.target.dataset.action) {
          const fn = actions[e.target.dataset.action];
          if (fn) fn(e.target);
        }
      });

      document.body.addEventListener('input', (e) => {
        if (e.target.dataset.action === 'preview-progress') {
          actions['preview-progress'](e.target);
        }
      });

      /* ═══════════════════════════════════════════════════════════════
         렌더
      ═══════════════════════════════════════════════════════════════ */
      function renderNav() {
        const views = [
          { id: 'home', label: '🏠 홈' },
          { id: 'developer', label: '🛠️ 개발자' },
        ];
        document.getElementById('nav').innerHTML = views
          .map(
            (v) =>
              '<button type="button" data-action="nav-view" data-view="' +
              v.id +
              '" class="' +
              (currentView === v.id ? 'active' : '') +
              '">' +
              v.label +
              '</button>'
          )
          .join('');
      }

      function render() {
        renderNav();
        const main = document.getElementById('main');
        if (currentView === 'developer') main.innerHTML = renderDeveloper();
        else main.innerHTML = renderHome();
      }

      render();
    </script>
  </body>
</html>
