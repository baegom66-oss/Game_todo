<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Dev Todo</title>
    <style>
      :root,
      [data-theme='dark'] {
        --bg: #0f1419;
        --surface: #1a2332;
        --surface2: #243044;
        --border: #2d3a4f;
        --text: #e8edf4;
        --muted: #8b9cb3;
        --accent: #5ce1e6;
        --accent2: #a78bfa;
        --dev: #fbbf24;
        --danger: #f87171;
        --radius: 10px;
        --font: 'Segoe UI', system-ui, sans-serif;
        --btn-primary-bg: #1e3a5f;
        --btn-primary-color: var(--accent);
        --card-shadow: none;
        --header-bg: transparent;
        --badge-scheduled: #93c5fd;
        --badge-planning: #c4b5fd;
        --badge-development: var(--dev);
        --badge-testing: #fb923c;
        --badge-closing: #f472b6;
        --badge-completed: #34d399;
      }
      [data-theme='office'] {
        --bg: #eef1f6;
        --surface: #ffffff;
        --surface2: #f3f5f9;
        --border: #cdd5e0;
        --text: #1c2434;
        --muted: #5a6778;
        --accent: #2563eb;
        --accent2: #4f46e5;
        --dev: #1d4ed8;
        --danger: #b91c1c;
        --radius: 6px;
        --font: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
        --btn-primary-bg: #2563eb;
        --btn-primary-color: #ffffff;
        --card-shadow: 0 1px 3px rgba(15, 23, 42, 0.07);
        --header-bg: #ffffff;
        --badge-scheduled: #1d4ed8;
        --badge-planning: #5b21b6;
        --badge-development: #1d4ed8;
        --badge-testing: #c2410c;
        --badge-closing: #9d174d;
        --badge-completed: #047857;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.5;
      }
      .app { max-width: 960px; margin: 0 auto; padding: 1rem 1.25rem 2rem; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
        padding: 1rem 0;
        border-bottom: 1px solid var(--border);
        background: var(--header-bg);
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        flex-wrap: wrap;
      }
      .theme-toggle { white-space: nowrap; }
      [data-theme='office'] .theme-toggle {
        background: var(--surface2);
        border-color: var(--border);
        color: var(--muted);
      }
      header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
      header h1 span { color: var(--accent); }
      [data-theme='office'] header h1 { font-size: 1.2rem; font-weight: 600; }
      [data-theme='office'] header h1 span { color: #1e3a5f; }
      nav {
        display: flex;
        gap: 0.35rem;
        background: var(--surface);
        padding: 0.35rem;
        border-radius: var(--radius);
        border: 1px solid var(--border);
      }
      nav button {
        border: none;
        background: transparent;
        color: var(--muted);
        padding: 0.5rem 1rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        transition: 0.15s;
      }
      nav button.active {
        background: var(--surface2);
        color: var(--text);
      }
      nav button[data-view='developer'].active { color: var(--dev); }
      nav button[data-view='brainstorm'].active { color: var(--accent2); }
      nav button[data-view='memos'].active { color: var(--accent); }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1rem 1.1rem;
        margin-bottom: 0.85rem;
        box-shadow: var(--card-shadow);
      }
      .card h2, .card h3 {
        font-size: 0.95rem;
        margin-bottom: 0.65rem;
        color: var(--accent);
      }
      [data-theme='office'] .card h2 { color: #1e3a5f; font-weight: 600; }
      [data-theme='office'] .card h3 { color: var(--muted); font-weight: 600; text-transform: none; }
      .card h3 { font-size: 0.88rem; color: var(--muted); }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; }
      @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
      .muted { color: var(--muted); font-size: 0.85rem; }
      .empty { color: var(--muted); font-size: 0.88rem; padding: 0.5rem 0; }
      input, textarea, select {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.5rem 0.65rem;
        border-radius: 8px;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
      }
      textarea { min-height: 72px; resize: vertical; }
      .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.5rem; }
      .row input, .row select { flex: 1; min-width: 120px; margin-bottom: 0; }
      button.btn {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.45rem 0.85rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 600;
      }
      button.btn:hover { border-color: var(--accent); }
      button.btn-primary {
        background: var(--btn-primary-bg);
        border-color: var(--accent);
        color: var(--btn-primary-color);
      }
      [data-theme='office'] button.btn:hover { background: var(--surface2); }
      [data-theme='office'] button.btn-primary:hover {
        background: #1d4ed8;
        border-color: #1d4ed8;
        color: #fff;
      }
      button.btn-dev { border-color: var(--dev); color: var(--dev); }
      button.btn-danger { border-color: var(--danger); color: var(--danger); }
      button.btn-sm { padding: 0.3rem 0.55rem; font-size: 0.78rem; }
      ul.list { list-style: none; }
      ul.list li {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        padding: 0.45rem 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.88rem;
      }
      ul.list li:last-child { border-bottom: none; }
      .project-item {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        cursor: pointer;
        padding: 0.55rem 0.65rem;
        border-radius: 8px;
        margin-bottom: 0.35rem;
        border: 1px solid transparent;
      }
      .project-item:hover { background: var(--surface2); }
      .project-item.selected {
        border-color: var(--accent);
        background: var(--surface2);
      }
      .project-item.dragging { opacity: 0.4; }
      .project-item.drag-over {
        border-color: var(--accent);
        background: var(--surface2);
        box-shadow: inset 0 2px 0 var(--accent);
      }
      .drag-handle {
        color: var(--muted);
        font-size: 1rem;
        line-height: 1;
        cursor: grab;
        user-select: none;
        padding: 0.1rem 0.2rem;
        flex-shrink: 0;
        opacity: 0.55;
      }
      .project-item:hover .drag-handle { opacity: 1; }
      .drag-handle:active { cursor: grabbing; }
      .project-item-body { flex: 1; min-width: 0; }
      .badge {
        display: inline-block;
        font-size: 0.72rem;
        padding: 0.15rem 0.45rem;
        border-radius: 6px;
        background: var(--surface2);
        color: var(--muted);
      }
      .badge-planned { color: var(--badge-scheduled); }
      .badge-in_progress { color: var(--badge-development); }
      .badge-completed { color: var(--badge-completed); }
      [data-theme='office'] .badge {
        background: var(--surface2);
        border: 1px solid var(--border);
        font-weight: 600;
      }
      .toast {
        position: fixed;
        bottom: 1.25rem;
        right: 1.25rem;
        background: var(--surface2);
        border: 1px solid var(--accent);
        color: var(--accent);
        padding: 0.65rem 1rem;
        border-radius: var(--radius);
        font-size: 0.88rem;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
        z-index: 100;
      }
      .toast.show { opacity: 1; }
      label.chk { display: flex; align-items: center; gap: 0.45rem; cursor: pointer; flex: 1; }
      label.chk input { width: auto; margin: 0; }
      .done-text { text-decoration: line-through; color: var(--muted); }
      .split { display: grid; grid-template-columns: 220px 1fr; gap: 1rem; }
      @media (max-width: 720px) { .split { grid-template-columns: 1fr; } }
      .section-title {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 0.85rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .badge-scheduled { color: var(--badge-scheduled); }
      .badge-planning { color: var(--badge-planning); }
      .badge-development { color: var(--badge-development); }
      .badge-testing { color: var(--badge-testing); }
      .badge-closing { color: var(--badge-closing); }
      .badge-completed { color: var(--badge-completed); }
      .badge-stopped { color: var(--muted); }
      .progress-block { margin: 0.5rem 0 0.75rem; }
      .progress-block input[type='range'] { width: 100%; margin: 0.35rem 0; }
      .progress-block .progress-val { font-size: 0.85rem; color: var(--dev); font-weight: 600; }
      .task-row { flex-wrap: wrap; align-items: center !important; }
      .task-row input.task-title-input { flex: 1; min-width: 140px; margin-bottom: 0; }
      .brainstorm-canvas { min-height: 280px; font-size: 0.92rem; line-height: 1.6; }
      .memo-collapse-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.35rem;
        flex-wrap: wrap;
      }
      .memo-snippet {
        font-size: 0.88rem;
        line-height: 1.45;
        padding: 0.35rem 0 0.5rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .memo-collapse-body.hidden { display: none; }
      .collapsible-head { cursor: pointer; user-select: none; padding: 0.25rem 0; margin-bottom: 0.35rem; }
      .collapsible-head:hover h3 { color: var(--accent); }
      .collapse-icon { color: var(--muted); font-size: 0.85rem; }
      .tasks-collapse-body.hidden { display: none; }
      .task-done-label {
        font-size: 0.78rem;
        margin: 0.65rem 0 0.35rem;
        padding-top: 0.5rem;
        border-top: 1px dashed var(--border);
      }
      .task-row.done-task { opacity: 0.75; }
      .rich-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin-bottom: 0.5rem;
        padding: 0.4rem;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .rich-toolbar .btn { margin-bottom: 0; padding: 0.25rem 0.5rem; min-width: 2rem; }
      .rich-editor {
        min-height: 280px;
        font-size: 0.92rem;
        line-height: 1.6;
        padding: 0.65rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        outline: none;
      }
      .rich-editor:focus { border-color: var(--accent); }
      .rich-editor:empty::before {
        content: attr(data-placeholder);
        color: var(--muted);
        pointer-events: none;
      }
      .rich-editor.bs-note-edit { min-height: 72px; }
      .memo-all-item {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem;
        margin-bottom: 0.65rem;
      }
      .memo-all-item .proj-tag {
        font-size: 0.78rem;
        color: var(--dev);
        margin-bottom: 0.35rem;
      }
      .idea-body-edit,
      #proj-idea-body {
        min-height: 100px;
        line-height: 1.55;
        font-size: 0.92rem;
        resize: vertical;
        overflow: hidden;
        width: 100%;
        white-space: pre-wrap;
        word-break: break-word;
      }
      [data-theme='office'] input,
      [data-theme='office'] textarea,
      [data-theme='office'] select {
        border-radius: 4px;
        background: #fff;
      }
      [data-theme='office'] input:focus,
      [data-theme='office'] textarea:focus,
      [data-theme='office'] select:focus {
        outline: 2px solid rgba(37, 99, 235, 0.25);
        border-color: var(--accent);
      }
      [data-theme='office'] .section-title {
        font-size: 1rem;
        font-weight: 600;
        color: #1e3a5f;
        border-left: 3px solid var(--accent);
        padding-left: 0.55rem;
      }
      [data-theme='office'] nav {
        background: var(--surface2);
        border-radius: 4px;
      }
      [data-theme='office'] nav button.active {
        background: #fff;
        color: var(--accent);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1 id="app-title">🎮 <span>Game Dev</span> Todo</h1>
        <div class="header-actions">
          <button
            type="button"
            id="theme-toggle"
            class="btn btn-sm theme-toggle"
            data-action="toggle-theme"
          >☀️ 사무용</button>
          <nav id="nav"></nav>
        </div>
      </header>
      <main id="main"></main>
    </div>
    <div id="toast" class="toast"></div>

    <script>
      /* ═══════════════════════════════════════════════════════════════
         데이터 구조 (src/types/index.ts)
      ═══════════════════════════════════════════════════════════════ */
      const STORAGE_KEY = 'game-life-manager:v1';
      const THEME_KEY = 'game-dev-todo-theme';

      let currentTheme = 'dark';

      function applyTheme(theme) {
        currentTheme = theme === 'office' ? 'office' : 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
        localStorage.setItem(THEME_KEY, currentTheme);
        const btn = document.getElementById('theme-toggle');
        const title = document.getElementById('app-title');
        if (btn) {
          btn.textContent = currentTheme === 'office' ? '🌙 다크' : '☀️ 사무용';
        }
        if (title) {
          title.innerHTML =
            currentTheme === 'office'
              ? '<span>Game Dev</span> Workspace'
              : '🎮 <span>Game Dev</span> Todo';
        }
      }

      function loadTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        applyTheme(saved === 'office' ? 'office' : 'dark');
      }

      loadTheme();

      const PROJECT_STATUSES = [
        { id: 'scheduled', label: '예정', hasPercent: false },
        { id: 'planning', label: '기획', hasPercent: true },
        { id: 'development', label: '개발', hasPercent: true },
        { id: 'testing', label: '테스트', hasPercent: true },
        { id: 'closing', label: '마감', hasPercent: true },
        { id: 'completed', label: '완료', hasPercent: false },
        { id: 'stopped', label: '중지', hasPercent: false },
      ];

      function createInitialAppData() {
        return {
          version: 4,
          devProjects: [],
          brainstorm: { canvas: '', notes: [] },
        };
      }

      function migrateAppData(parsed) {
        if (!parsed || typeof parsed !== 'object') return createInitialAppData();

        delete parsed.games;
        delete parsed.developerStats;

        const statusMap = {
          planned: 'scheduled',
          backlog: 'scheduled',
          scheduled: 'scheduled',
          design: 'planning',
          planning: 'planning',
          dev: 'development',
          development: 'development',
          in_progress: 'development',
          test: 'testing',
          testing: 'testing',
          polish: 'closing',
          closing: 'closing',
          released: 'completed',
          completed: 'completed',
          hold: 'stopped',
          stopped: 'stopped',
        };

        parsed.devProjects = (parsed.devProjects || []).map((p) => {
          const st = statusMap[p.status] || p.status || 'scheduled';
          const def = PROJECT_STATUSES.find((s) => s.id === st) || PROJECT_STATUSES[0];
          const ideas = (p.ideas || []).map((idea) => ({
            id: idea.id || uid(),
            body: idea.body || idea.title || '',
            memoDate:
              idea.memoDate ||
              (idea.createdAt && idea.createdAt.slice(0, 10)) ||
              todayStr(),
            pinned: !!idea.pinned,
            createdAt: idea.createdAt || nowIso(),
            updatedAt: idea.updatedAt || nowIso(),
          }));
          return {
            ...p,
            status: st,
            progressPercent: def.hasPercent
              ? Math.min(100, Math.max(0, p.progressPercent ?? 0))
              : undefined,
            ideas,
            tasks: sortTasks(p.tasks || []),
          };
        });

        if (parsed.ideaMemos && parsed.ideaMemos.length) {
          parsed.ideaMemos.forEach((m) => {
            const pid = m.projectId;
            const proj = pid && parsed.devProjects.find((x) => x.id === pid);
            const idea = {
              id: m.id || uid(),
              body: m.body || m.title || '',
              memoDate:
                m.memoDate ||
                (m.createdAt && m.createdAt.slice(0, 10)) ||
                todayStr(),
              pinned: !!m.pinned,
              createdAt: m.createdAt || nowIso(),
              updatedAt: m.updatedAt || nowIso(),
            };
            if (proj) proj.ideas.push(idea);
            else if (parsed.devProjects[0]) parsed.devProjects[0].ideas.push(idea);
          });
        }

        delete parsed.devJournals;
        delete parsed.ideaMemos;
        parsed.version = 4;
        parsed.brainstorm = parsed.brainstorm || { canvas: '', notes: [] };
        if (typeof parsed.brainstorm.canvas !== 'string') parsed.brainstorm.canvas = '';
        if (!Array.isArray(parsed.brainstorm.notes)) parsed.brainstorm.notes = [];
        return parsed;
      }

      /* ═══════════════════════════════════════════════════════════════
         LocalStorage
      ═══════════════════════════════════════════════════════════════ */
      let state = loadAppData();
      let currentView = 'home';
      let selectedProjectId = null;
      let memoFilterProjectId = null;
      let expandedMemos = new Set();
      let tasksSectionOpenByProject = {};

      function loadAppData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return createInitialAppData();
          const parsed = JSON.parse(raw);
          if (parsed) return migrateAppData(parsed);
        } catch (e) {
          console.warn('load failed', e);
        }
        return createInitialAppData();
      }

      function saveAppData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        render();
      }

      function persist() {
        saveAppData();
      }

      /* ═══════════════════════════════════════════════════════════════
         유틸
      ═══════════════════════════════════════════════════════════════ */
      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function nowIso() {
        return new Date().toISOString();
      }

      function todayStr() {
        return new Date().toISOString().slice(0, 10);
      }

      function fmtDate(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return d.toLocaleString('ko-KR', {
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });
      }

      function statusLabel(s) {
        const found = PROJECT_STATUSES.find((x) => x.id === s);
        if (found) return found.label;
        return { planned: '백로그', in_progress: '개발 중', completed: '출시 완료' }[s] || s;
      }

      function statusDisplay(p) {
        let t = statusLabel(p.status);
        const def = PROJECT_STATUSES.find((s) => s.id === p.status);
        if (def && def.hasPercent && p.progressPercent != null) {
          t += ' ' + p.progressPercent + '%';
        }
        return t;
      }

      function isActiveProject(p) {
        return ['scheduled', 'planning', 'development', 'testing', 'closing'].includes(p.status);
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove('show'), 2200);
      }

      function getAllMemos() {
        const memos = [];
        state.devProjects.forEach((p) => {
          (p.ideas || []).forEach((m) => {
            memos.push({
              ...m,
              projectId: p.id,
              projectName: p.name,
            });
          });
        });
        return memos.sort((a, b) => {
          if (a.pinned && !b.pinned) return -1;
          if (!a.pinned && b.pinned) return 1;
          const da = a.memoDate || '';
          const db = b.memoDate || '';
          if (db !== da) return db > da ? 1 : -1;
          return b.updatedAt > a.updatedAt ? 1 : -1;
        });
      }

      function sortIdeas(ideas) {
        return [...ideas].sort((a, b) => {
          if (a.pinned && !b.pinned) return -1;
          if (!a.pinned && b.pinned) return 1;
          const da = a.memoDate || '';
          const db = b.memoDate || '';
          if (db !== da) return db > da ? 1 : -1;
          return b.updatedAt > a.updatedAt ? 1 : -1;
        });
      }

      function sortTasks(tasks) {
        const pending = tasks.filter((t) => !t.done);
        const done = tasks.filter((t) => t.done);
        return [...pending, ...done];
      }

      function isMemoLong(body) {
        const b = body || '';
        return b.length > 80 || b.split('\n').length > 3;
      }

      function memoSnippet(body) {
        const t = (body || '').replace(/\s+/g, ' ').trim();
        return t.length > 90 ? t.slice(0, 90) + '…' : t || '(내용 없음)';
      }

      function isMemoExpanded(m) {
        if (!isMemoLong(m.body)) return true;
        return expandedMemos.has(m.id);
      }

      function bodyToEditorHtml(body) {
        if (!body) return '';
        if (/<[a-z][\s\S]*>/i.test(body)) return body;
        return esc(body).replace(/\n/g, '<br>');
      }

      function richToolbarHtml(targetId) {
        const colors = [
          ['#dc2626', '빨강'],
          ['#2563eb', '파랑'],
          ['#16a34a', '초록'],
          ['#ca8a04', '노랑'],
          ['#9333ea', '보라'],
        ];
        return (

      function fitMemoTextareas(root) {
        const scope = root || document;
        scope.querySelectorAll('.idea-body-edit:not(.hidden), #proj-idea-body').forEach((ta) => {
          if (ta.closest('.memo-collapse-body.hidden')) return;
          const fit = () => {
            ta.style.height = 'auto';
            const lines = Math.max(1, (ta.value || '').split('\n').length);
            const minH = Math.max(100, lines * 26 + 28);
            ta.style.minHeight = minH + 'px';
            ta.style.height = Math.max(minH, ta.scrollHeight + 4) + 'px';
          };
          fit();
          if (!ta.dataset.fitBound) {
            ta.dataset.fitBound = '1';
            ta.addEventListener('input', fit);
          }
        });
      }

      function esc(s) {
        if (s == null) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function reorderProjects(fromId, toId) {
        if (!fromId || !toId || fromId === toId) return;
        const list = state.devProjects;
        const fromIdx = list.findIndex((p) => p.id === fromId);
        const toIdx = list.findIndex((p) => p.id === toId);
        if (fromIdx < 0 || toIdx < 0) return;
        const [item] = list.splice(fromIdx, 1);
        list.splice(toIdx, 0, item);
        persist();
      }

      function bindProjectDragDrop() {
        const listEl = document.getElementById('project-list');
        if (!listEl) return;

        let draggedId = null;

        listEl.querySelectorAll('.drag-handle').forEach((handle) => {
          handle.addEventListener('dragstart', (e) => {
            const item = handle.closest('.project-item');
            if (!item) return;
            draggedId = item.dataset.id;
            item.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', draggedId);
            e.dataTransfer.setDragImage(item, 24, 16);
          });
          handle.addEventListener('dragend', () => {
            const item = handle.closest('.project-item');
            if (item) item.classList.remove('dragging');
            listEl.querySelectorAll('.project-item').forEach((el) =>
              el.classList.remove('drag-over')
            );
            draggedId = null;
          });
        });

        listEl.querySelectorAll('.project-item').forEach((item) => {
          item.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (item.dataset.id !== draggedId) item.classList.add('drag-over');
          });
          item.addEventListener('dragleave', (e) => {
            if (!item.contains(e.relatedTarget)) item.classList.remove('drag-over');
          });
          item.addEventListener('drop', (e) => {
            e.preventDefault();
            item.classList.remove('drag-over');
            const fromId = e.dataTransfer.getData('text/plain') || draggedId;
            const toId = item.dataset.id;
            if (fromId && toId) reorderProjects(fromId, toId);
          });
        });
      }

      function baseEntity() {
        const t = nowIso();
        return { id: uid(), createdAt: t, updatedAt: t };
      }

      const actions = {
        'nav-view'(el) {
          currentView = el.dataset.view;
          render();
        },
        'toggle-theme'() {
          applyTheme(currentTheme === 'office' ? 'dark' : 'office');
        },
        'apply-memo-filter'() {
          const sel = document.getElementById('memo-filter');
          memoFilterProjectId = sel && sel.value ? sel.value : null;
          render();
        },
        'toggle-memo-expand'(el) {
          const mid = el.dataset.mid;
          if (expandedMemos.has(mid)) expandedMemos.delete(mid);
          else expandedMemos.add(mid);
          render();
        },
        'toggle-tasks-section'(el) {
          const pid = el.dataset.pid;
          const open = tasksSectionOpenByProject[pid] !== false;
          tasksSectionOpenByProject[pid] = !open;
          render();
        },
        'rich-cmd'(el) {
          const cmd = el.dataset.cmd;
          const val = el.dataset.val;
          const toolbar = el.closest('.rich-toolbar');
          const targetId = toolbar && toolbar.dataset.target;
          const editor = targetId ? document.getElementById(targetId) : null;
          if (!editor) return;
          editor.focus();
          if (cmd === 'foreColor' || cmd === 'hiliteColor') {
            document.execCommand(cmd, false, val);
          } else {
            document.execCommand(cmd, false, val || null);
          }
          if (editor.id === 'brainstorm-canvas') actions['save-brainstorm-canvas']();
        },
        'save-brainstorm-canvas'() {
          const el = document.getElementById('brainstorm-canvas');
          if (!el) return;
          if (!state.brainstorm) state.brainstorm = { canvas: '', notes: [] };
          state.brainstorm.canvas = el.innerHTML;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        },
        'add-bs-note'() {
          const el = document.getElementById('new-bs-note');
          const textOnly = el ? el.textContent.trim() : '';
          if (!textOnly) return alert('내용을 입력하세요.');
          if (!state.brainstorm) state.brainstorm = { canvas: '', notes: [] };
          state.brainstorm.notes.unshift({
            id: uid(),
            body: el.innerHTML,
            createdAt: nowIso(),
            updatedAt: nowIso(),
          });
          el.innerHTML = '';
          persist();
        },
        'save-bs-note'(el) {
          const n = state.brainstorm.notes.find((x) => x.id === el.dataset.nid);
          const ed = document.getElementById('bs-note-' + el.dataset.nid);
          if (!n || !ed) return;
          n.body = ed.innerHTML;
          n.updatedAt = nowIso();
          showToast('저장됨');
          persist();
        },
        'del-bs-note'(el) {
          if (!state.brainstorm) return;
          state.brainstorm.notes = state.brainstorm.notes.filter(
            (n) => n.id !== el.dataset.nid
          );
          persist();
        },
        'add-project'() {
          const name = document.getElementById('new-proj-name').value.trim();
          if (!name) return alert('프로젝트명을 입력하세요.');
          const p = {
            ...baseEntity(),
            name,
            status: 'scheduled',
            tasks: [],
            ideas: [],
          };
          state.devProjects.push(p);
          selectedProjectId = p.id;
          persist();
        },
        'select-project'(el) {
          selectedProjectId = el.dataset.id;
          render();
        },
        'save-project'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.id);
          if (!p) return;
          p.name = document.getElementById('proj-name').value.trim() || p.name;
          p.status = document.getElementById('proj-status').value;
          const def = PROJECT_STATUSES.find((s) => s.id === p.status);
          if (def && def.hasPercent) {
            const prog = document.getElementById('proj-progress');
            p.progressPercent = prog
              ? Math.min(100, Math.max(0, parseInt(prog.value, 10) || 0))
              : p.progressPercent ?? 0;
          } else {
            delete p.progressPercent;
          }
          p.updatedAt = nowIso();
          persist();
        },
        'preview-progress'(el) {
          const val = document.getElementById('proj-progress-val');
          if (val) val.textContent = el.value + '%';
        },
        'delete-project'(el) {
          if (!confirm('프로젝트를 삭제할까요?')) return;
          state.devProjects = state.devProjects.filter((p) => p.id !== el.dataset.id);
          if (selectedProjectId === el.dataset.id) selectedProjectId = null;
          persist();
        },
        'add-task'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.id);
          const title = document.getElementById('new-task').value.trim();
          if (!p || !title) return;
          p.tasks.push({ ...baseEntity(), title, done: false });
          p.updatedAt = nowIso();
          persist();
        },
        'toggle-task'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          const t = p && p.tasks.find((x) => x.id === el.dataset.tid);
          if (!t) return;
          t.done = el.checked;
          t.updatedAt = nowIso();
          if (t.done) t.completedAt = nowIso();
          else delete t.completedAt;
          p.tasks = sortTasks(p.tasks);
          p.updatedAt = nowIso();
          persist();
        },
        'save-task'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          const t = p && p.tasks.find((x) => x.id === el.dataset.tid);
          if (!t) return;
          const inp = document.getElementById('task-title-' + t.id);
          const title = (inp && inp.value.trim()) || t.title;
          if (!title) return alert('작업 제목을 입력하세요.');
          t.title = title;
          t.updatedAt = nowIso();
          p.updatedAt = nowIso();
          showToast('작업 수정됨');
          persist();
        },
        'del-task'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          if (!p) return;
          p.tasks = p.tasks.filter((t) => t.id !== el.dataset.tid);
          p.updatedAt = nowIso();
          persist();
        },
        'add-proj-idea'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.id);
          const memoDate = document.getElementById('proj-idea-date').value || todayStr();
          const body = document.getElementById('proj-idea-body').value.trim();
          if (!p) return;
          if (!body) return alert('내용을 입력하세요.');
          if (!p.ideas) p.ideas = [];
          p.ideas.unshift({
            ...baseEntity(),
            memoDate,
            body,
            pinned: false,
          });
          p.updatedAt = nowIso();
          document.getElementById('proj-idea-body').value = '';
          document.getElementById('proj-idea-date').value = todayStr();
          persist();
        },
        'save-proj-idea'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          const m = p && p.ideas && p.ideas.find((x) => x.id === el.dataset.iid);
          if (!m) return;
          const dateEl = document.querySelector(
            '.idea-date-edit[data-iid="' + m.id + '"]'
          );
          const bodyEl = document.querySelector(
            '.idea-body-edit[data-iid="' + m.id + '"]'
          );
          m.memoDate = (dateEl && dateEl.value) || m.memoDate || todayStr();
          m.body = bodyEl ? bodyEl.value : m.body;
          m.updatedAt = nowIso();
          p.updatedAt = nowIso();
          showToast('메모 저장됨');
          persist();
        },
        'toggle-proj-pin'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          const m = p && p.ideas && p.ideas.find((x) => x.id === el.dataset.iid);
          if (!m) return;
          m.pinned = !m.pinned;
          m.updatedAt = nowIso();
          p.updatedAt = nowIso();
          persist();
        },
        'del-proj-idea'(el) {
          const p = state.devProjects.find((x) => x.id === el.dataset.pid);
          if (!p || !p.ideas) return;
          p.ideas = p.ideas.filter((m) => m.id !== el.dataset.iid);
          p.updatedAt = nowIso();
          persist();
        },
      };

      document.body.addEventListener('mousedown', (e) => {
        if (e.target.closest('[data-action="rich-cmd"]')) e.preventDefault();
      });

      document.body.addEventListener('click', (e) => {
        const el = e.target.closest('[data-action]');
        if (!el) return;
        const fn = actions[el.dataset.action];
        if (fn) fn(el);
      });

      document.body.addEventListener('change', (e) => {
        if (e.target.dataset.action) {
          const fn = actions[e.target.dataset.action];
          if (fn) fn(e.target);
        }
      });

      function bindRichEditors() {
        const canvas = document.getElementById('brainstorm-canvas');
        if (canvas && !canvas.dataset.bsBound) {
          canvas.dataset.bsBound = '1';
          canvas.addEventListener('input', () => actions['save-brainstorm-canvas']());
        }
      }

      document.body.addEventListener('input', (e) => {
        if (e.target.dataset.action === 'preview-progress') {
          actions['preview-progress'](e.target);
        }
      });

      /* ═══════════════════════════════════════════════════════════════
         렌더
      ═══════════════════════════════════════════════════════════════ */
      function renderNav() {
        const views = [
          { id: 'home', label: '🏠 홈' },
          { id: 'developer', label: '🛠️ 프로젝트' },
          { id: 'brainstorm', label: '💡 브레인스톰' },
          { id: 'memos', label: '📝 메모' },
        ];
        document.getElementById('nav').innerHTML = views
          .map(
            (v) =>
              '<button type="button" data-action="nav-view" data-view="' +
              v.id +
              '" class="' +
              (currentView === v.id ? 'active' : '') +
              '">' +
              v.label +
              '</button>'
          )
          .join('');
      }

      function render() {
        renderNav();
        const main = document.getElementById('main');
        if (currentView === 'developer') main.innerHTML = renderDeveloper();
        else if (currentView === 'brainstorm') main.innerHTML = renderBrainstorm();
        else if (currentView === 'memos') main.innerHTML = renderMemosAll();
        else main.innerHTML = renderHome();
        if (currentView === 'developer') bindProjectDragDrop();
        if (currentView === 'brainstorm') bindRichEditors();
        if (currentView === 'developer' || currentView === 'memos') {
          requestAnimationFrame(() => fitMemoTextareas());
        }
      }

      render();
    </script>
  </body>
</html>
